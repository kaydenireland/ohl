[package]
name = "ohl"
version = "0.1.0"
edition = "2024"
default-run = "ohlc"

[[bin]]
name = "ohlc"
path = "src/bin/ohlc.rs"

[[bin]]
name = "oo"
path = "src/bin/oo.rs"

[[bin]]
name = "eos"
path = "src/bin/eos.rs"

[dependencies]
clap = { version = "4.5.53", features = ["derive"] }
colored = "3.0.0"
spin = "0.5.2"
log = "0.4.34"

[dependencies.lazy_static]
version = "1.0"
features = ["spin_no_std"]
